<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Images Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #52ec45;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px #000;
        }
        p {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .image-box {
            border: 4px solid #4a4a4a;
            border-radius: 5px;
            overflow: hidden;
            background-color: #111;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>hello this is Minecraft images</h1>
        <p>Explore some of the best landscapes and builds below.</p>
        
        <div class="image-box">
            <!-- Using a reliable, public Minecraft image from Unsplash -->
            <img src="https://unsplash.com" alt="Minecraft Landscape">
        </div>
    </div>

</body>
</html>
